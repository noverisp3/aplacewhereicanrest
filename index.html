<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a place where i can rest</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="core/style.css">
</head>
<body>

  <header>
    <h1 class="title">a place where i can rest</h1>
    <div class="theme-picker">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleMenu()"></button>
      <div class="theme-menu" id="theme-menu">
        <div class="theme-option" data-theme="light" onclick="setTheme('light')"><span class="theme-dot" style="background:#f9f8f6"></span>light</div>
        <div class="theme-option" data-theme="dark" onclick="setTheme('dark')"><span class="theme-dot" style="background:#1a1a1a"></span>dark</div>
        <div class="theme-option" data-theme="sepia" onclick="setTheme('sepia')"><span class="theme-dot" style="background:#f4ecd8"></span>sepia</div>
        <div class="theme-option" data-theme="moon" onclick="setTheme('moon')"><span class="theme-dot" style="background:#1b2838"></span>moon</div>
        <div class="theme-option" data-theme="forest" onclick="setTheme('forest')"><span class="theme-dot" style="background:#2d3b2d"></span>forest</div>
        <div class="theme-option" data-theme="rose" onclick="setTheme('rose')"><span class="theme-dot" style="background:#fdf2f4"></span>rose</div>
        <div class="theme-option" data-theme="minimal" onclick="setTheme('minimal')"><span class="theme-dot" style="background:#fff;border:1px solid #ccc"></span>minimal</div>
        <div class="theme-option" data-theme="typewriter" onclick="setTheme('typewriter')"><span class="theme-dot" style="background:#f5f0e8"></span>typewriter</div>
      </div>
    </div>
  </header>

  <main>
    <section class="write">
      <textarea id="post-content" placeholder="write something..." class="textarea" rows="4"></textarea>
      <div id="preview"></div>
      <div class="actions">
        <input type="file" id="image-input" accept="image/*" onchange="selectImage(event)">
        <button class="btn btn-soft" onclick="document.getElementById('image-input').click()">photo</button>
        <button class="btn" onclick="submitPost()">post</button>
      </div>
    </section>

    <div class="divider"></div>

    <section class="search">
      <div class="search-row">
        <input type="text" id="search-input" class="search-input" placeholder="search posts..." oninput="debounceSearch()">
      </div>
      <div class="search-row search-dates">
        <input type="date" id="date-from" class="date-input" onchange="searchPosts()">
        <span class="date-sep">—</span>
        <input type="date" id="date-to" class="date-input" onchange="searchPosts()">
        <button class="btn-clear" id="clear-search" onclick="clearSearch()" style="display:none">clear</button>
      </div>
    </section>

    <div class="post-count" id="post-count"></div>

    <section class="posts" id="posts-container"></section>
    <div id="scroll-sentinel"></div>
  </main>

  <footer>
    <p class="footer-text"><span id="current-year"></span></p>
  </footer>

  <script src="core/main.js"></script>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-actions">
      <button class="lightbox-btn" id="lightbox-download" onclick="downloadLightbox(event)">↓</button>
      <button class="lightbox-btn" onclick="closeLightbox(event)">x</button>
    </div>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
  </div>

  <div class="auth-screen" id="auth-screen">
    <div class="auth-box">
      <p class="auth-label">enter password</p>
      <input type="password" id="auth-input" class="auth-input" placeholder="..." onkeydown="if(event.key==='Enter')doAuth()">
      <p class="auth-error" id="auth-error"></p>
      <button class="btn" onclick="doAuth()">enter</button>
    </div>
  </div>
</body>
</html>
